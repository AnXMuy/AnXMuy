name: Refresh profile activity
on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
permissions:
  contents: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate blue contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: AnXMuy
          outputs: assets/contribution-snake.svg?color_snake=397b9b&color_dots=edf5fa,d1e7f1,a3ccdf,74abc6,477f9e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update repository commit feed
        run: node scripts/update-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contribution-snake.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh activity and contribution art"
            git push origin HEAD:main
          fi
